name: Windows

# Scoped to the windows branch, deliberately.
#
# The Windows port is a separate toolchain living under windows/, and the macOS build in main has
# nothing to gain from a ten-minute MSI build. Restricting the branch, rather than only the paths,
# means a merge into main never quietly starts running this.
#
# There is no path filter. On a branch that only ever carries Windows work it would add nothing, and
# path filters interact badly with tag pushes - a release tag can be skipped because the push that
# carried it touched no matching file.
on:
  push:
    branches:
      - windows
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on the build'
        required: false
        default: '0.1.0'

# Nothing in this workflow writes to the repository except the release job, which asks for it itself.
# Every other job is read-only.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------------------------
  # Build and test. Gates everything downstream.
  # ---------------------------------------------------------------------------------------------
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/**/*.wixproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        working-directory: windows
        run: dotnet restore SplitLane.Windows.slnx

      # Warnings are errors project-wide, so this step is also the style and API-hygiene gate.
      - name: Build
        working-directory: windows
        run: dotnet build SplitLane.Windows.slnx --configuration Release --no-restore

      # 586 tests, none of which needs a network, a driver, elevation, or a daemon started first.
      # The SOCKS5 integration tests run against an in-process server, so they run here rather than
      # being skipped the way a Docker-dependent suite would be.
      # LogFilePrefix, not LogFileName: two test projects writing one fixed filename means the
      # second overwrites the first, and the published record then reports 136 tests where 586 ran.
      # The gate was still sound - the step fails on any failure - but a result that understates
      # itself is the kind of thing this project treats as a defect.
      - name: Test
        working-directory: windows
        run: >
          dotnet test SplitLane.Windows.slnx
          --configuration Release --no-build
          --logger "trx;LogFilePrefix=results"
          --results-directory ../artifacts/test-results

      - name: Publish test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # Package. Produces the MSI and the portable zip through the same script a developer runs, so a
  # release built here and one built by hand come out of the same steps rather than out of two
  # descriptions of them that drift apart.
  # ---------------------------------------------------------------------------------------------
  package:
    name: Package
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/**/*.wixproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # A tag is the version. Anything else is that version plus the run number, so untagged builds
      # are ordered and distinguishable without ever colliding with a real release.
      # Inputs reach the script through the environment, never spliced into its text: an expression
      # pasted into a script becomes part of the script.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          elseif ($env:INPUT_VERSION) {
              $version = $env:INPUT_VERSION
          }
          else {
              $version = "0.1.0.$env:GITHUB_RUN_NUMBER"
          }

          # MSI product versions are four numeric fields at most, and msiexec rejects anything else
          # at install time rather than at build time — which would mean shipping a broken artifact.
          if ($version -notmatch '^\d+(\.\d+){0,3}$') {
              throw "Version '$version' is not a valid MSI product version (up to four numeric fields)."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Build installer and portable archive
        working-directory: windows
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/build-installer.ps1 -Version $env:BUILD_VERSION

      # The MSI is unsigned. SmartScreen will warn on first run, and saying so here is better than
      # letting each person discover it and wonder whether the download was tampered with.
      - name: Record artifact hashes
        working-directory: windows/artifacts/release
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lines = @(
              'SplitLane for Windows'
              "Version $env:BUILD_VERSION"
              "Commit  $env:GITHUB_SHA"
              ''
              'SHA-256'
          )
          Get-ChildItem -File | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $lines += "  $hash  $($_.Name)"
          }
          $lines += ''
          $lines += 'These files are not code-signed. Windows SmartScreen will warn on first run.'
          $lines += 'Verify the hashes above against this workflow run before installing.'
          $lines | Set-Content -Path 'SHA256SUMS.txt' -Encoding utf8
          Get-Content 'SHA256SUMS.txt'

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splitlane-windows-${{ steps.version.outputs.version }}
          path: |
            windows/artifacts/release/*.msi
            windows/artifacts/release/*.zip
            windows/artifacts/release/SHA256SUMS.txt
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # Sign. Tag-only. The only job that ever sees the update-signing key (SL-SEC-002).
  #
  # Trust boundary: every installed engine accepts a manifest signed with this key, and the engine
  # runs as LocalSystem. Whoever holds the key can therefore run code as SYSTEM on every machine with
  # SplitLane. The rules for this job follow from that:
  #
  #   - no third-party action runs here; the two actions used are GitHub's own, pinned to a commit,
  #     and both run in steps whose environment never contains the key;
  #   - the secret is bound to the one step that signs, never to the job;
  #   - the key is imported into memory only, never written to disk, and disposed in that step;
  #   - the job has read-only permissions and produces two small files; publishing is the next job,
  #     which has write permission and no key.
  # ---------------------------------------------------------------------------------------------
  sign:
    name: Sign update manifest
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download packaged output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: splitlane-windows-*
          merge-multiple: true
          path: release

      # The update manifest, and the signature installed engines check it against.
      #
      # A release published without the secret gets no manifest rather than an unsigned one. An
      # unsigned manifest is not a lesser update; it is one that nothing will install, and producing
      # it quietly would look like a working release until somebody tried to upgrade.
      - name: Sign the update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
              Write-Host 'No signing key configured: this release gets no update manifest.'
              exit 0
          }

          $version = $env:REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}$') { throw "Tag '$env:REF_NAME' is not a release version." }

          $msi = Get-ChildItem release -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI in the release directory.' }

          $manifest = [ordered]@{
              version    = $version
              url        = "https://github.com/$env:REPOSITORY/releases/download/$env:REF_NAME/$($msi.Name)"
              sha256     = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
              releasedAt = (Get-Date).ToUniversalTime().ToString('o')
              notes      = 'See the release notes for what changed.'
          } | ConvertTo-Json -Compress

          # Written as UTF-8 with no byte-order mark, and signed over exactly those bytes. The
          # engine verifies the document as published, before parsing it, so a BOM added here would
          # be a byte it never saw and every installation would refuse the release.
          New-Item -ItemType Directory -Force signed | Out-Null
          [IO.File]::WriteAllText("$PWD/signed/update.json", $manifest, [Text.UTF8Encoding]::new($false))

          $key = [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY)
          $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
          try {
              $ecdsa.ImportPkcs8PrivateKey($key, [ref]0)
              $signature = $ecdsa.SignData(
                  [Text.Encoding]::UTF8.GetBytes($manifest),
                  [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          }
          finally {
              $ecdsa.Dispose()
              [Array]::Clear($key, 0, $key.Length)
              Remove-Item Env:UPDATE_SIGNING_KEY -ErrorAction SilentlyContinue
          }

          [IO.File]::WriteAllText("$PWD/signed/update.json.sig", [Convert]::ToBase64String($signature))
          Write-Host "Signed update.json for $version"

      - name: Hand the signed manifest on
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splitlane-update-manifest
          path: signed/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # Release. Tag-only. Attaches the packaged output and the signed manifest to a GitHub release.
  #
  # This job has contents: write and no signing key. It publishes with the GitHub CLI that ships on
  # the runner, not a third-party release action, so no code from outside GitHub runs with a token
  # that can rewrite releases.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged output and manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: splitlane-*
          merge-multiple: true
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          notes="windows/docs/releases/${REF_NAME}.md"
          if [ ! -f "$notes" ]; then echo "Release notes $notes are missing." >&2; exit 1; fi
          gh release create "$REF_NAME" release/* --title "$REF_NAME" --notes-file "$notes" --verify-tag
